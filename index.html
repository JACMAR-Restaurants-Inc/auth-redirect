<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connexion en cours…</title>
<style>
  /* Safe Count's design system, the same as the portal's. This page sits in the
     middle of the sign-in flow, so a white screen here is a white screen between
     two dark ones - which reads as something having gone wrong, at the one moment
     the user has no way to tell. */
  :root {
    --gold:#FFC72C; --dark-gold:#E8A800;
    --dark-bg:#1A1A1A; --card-bg:#232323; --border:#3A3A3A;
    --text:#F5F5F5; --text-muted:#9E9E9E; --text-dim:#6B6B6B;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100vh;
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
    font-size: 15px; line-height: 1.6;
    background: var(--dark-bg); color: var(--text);
  }
  body { display: grid; place-items: center; }
  main { text-align: center; padding: 24px; max-width: 420px; }

  .mark {
    width: 56px; height: 56px; margin: 0 auto 18px; border-radius: 14px;
    background: var(--gold); color: var(--dark-bg);
    font-size: 20px; font-weight: 700; letter-spacing: -.02em;
    display: flex; align-items: center; justify-content: center;
  }
  .spinner {
    width: 22px; height: 22px; margin: 0 auto 16px; border-radius: 50%;
    border: 2px solid var(--border); border-top-color: var(--gold);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* A spinner that cannot spin is just a broken ring. */
  @media (prefers-reduced-motion: reduce) {
    .spinner { animation: none; border-top-color: var(--border); border-right-color: var(--gold); }
  }

  h1 { font-size: 17px; font-weight: 600; margin: 0 0 6px; }
  p  { color: var(--text-muted); font-size: 14px; margin: 0; }
  .brand {
    margin-top: 26px; font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--text-dim);
  }
  #fallback { margin-top: 20px; display: none; }
  a {
    display: inline-block; font-weight: 600; background: var(--gold); color: var(--dark-bg);
    text-decoration: none; border-radius: 6px; padding: 11px 18px;
  }
  a:hover { background: var(--dark-gold); }
</style>
</head>
<body>
<main>
  <div class="mark">JM</div>
  <div class="spinner" id="spinner"></div>
  <h1 id="title">Connexion en cours…</h1>
  <p id="msg">Un instant.</p>
  <p id="fallback"><a id="go" href="#">Continuer</a></p>
  <p class="brand">Jacmar Restaurants Inc.</p>
</main>

<script>
  // The message is painted BEFORE the navigation is issued, deliberately.
  //
  // An earlier version ran this in <head> so the browser never painted at all. That
  // was the wrong goal: the hop to this host is a real network round trip, so
  // "never paint" means a blank white screen for as long as it takes - which reads
  // as broken. A short "Signing you in…" reads as working. Being seen is the point.
  (function () {
    // The portal seeds language from navigator.language and remembers the choice
    // in localStorage. This page is a different origin, so it cannot read that -
    // it can only apply the same seeding rule. It is on screen for about a second
    // and has no control to toggle, so there is nothing to remember anyway.
    var EN = /^en/i.test(navigator.language || '');
    var T = EN ? {
      title:      'Signing you in…',
      msg:        'One moment.',
      go:         'Continue',
      idle_title: 'Nothing to do here',
      idle_msg:   'This page is only used part-way through signing in.',
      bad_title:  'Link not recognised',
      bad_msg:    'Please start again from the app you were opening.',
      slow:       'Still going. Use the button if nothing happens.'
    } : {
      title:      'Connexion en cours…',
      msg:        'Un instant.',
      go:         'Continuer',
      idle_title: 'Rien à faire ici',
      idle_msg:   'Cette page ne sert qu’au milieu du processus de connexion.',
      bad_title:  'Lien non reconnu',
      bad_msg:    'Recommencez depuis l’application que vous ouvriez.',
      slow:       'Toujours en cours. Utilisez le bouton si rien ne se passe.'
    };

    // Set before the first paint - this script runs at the end of <body>, and the
    // navigation below is deferred by two animation frames precisely so the paint
    // happens first.
    document.documentElement.lang = EN ? 'en' : 'fr';
    document.getElementById('title').textContent = T.title;
    document.getElementById('msg').textContent   = T.msg;
    document.getElementById('go').textContent    = T.go;

    var DESTINATIONS = {
      'portal': 'https://script.google.com/macros/s/AKfycbw9ITLeoTRo1qI-MkmkAdPpId7GeqwT6LgL8V9igMxkPpQmVvK_WYqtwhkIcU4GuTDh/exec',
      // Cash Balancing. TWO keys, and which is which matters.
      //
      // 'safecount' is the REAL app - the production script and the real Cash
      // Balancing spreadsheet. 'safecount-test' is the test copy.
      //
      // They diverged on 2026-08-26, when the trial deployment went live. Before
      // that both pointed at test, and the symptom of leaving it that way was
      // exactly what this split exists to prevent: signing in on the TRIAL url
      // minted a state saying 'safecount', this page forwarded it to TEST, the test
      // app rejected the mismatched key and bounced to a fresh sign-in, and the
      // second attempt succeeded - INTO THE TEST APP. Two sign-ins and the wrong
      // spreadsheet, with no error anywhere.
      //
      // An earlier note here said to swap this single key at cutover rather than
      // add a second, "so a stale destination cannot outlive its purpose". That was
      // written for a cutover, where the test app dies. A TRIAL is different: the
      // two run side by side, and one key cannot serve both.
      //
      // What it cannot serve them badly is the point. Both apps are built from one
      // repo, so both would call themselves 'safecount': point that key at
      // production and a sign-in begun in the test app is forwarded to production,
      // the state still validates because the key matches, the code is still
      // exchanged, and somebody files a count into the REAL spreadsheet believing
      // they are in test. Silently wrong, not broken.
      //
      // The app-side key now comes from a Script Property, defaulting to
      // 'safecount' - so production is correct with nothing set, and only the test
      // script carries the override.
      'safecount':      'https://script.google.com/macros/s/AKfycbzyfEGc760BCyS7OKbXQTzklaBdJGPnEG0c7-zkMFKurKRrlDPwiV7GDCXd9I5TINf-QQ/exec',
      'safecount-test': 'https://script.google.com/macros/s/AKfycbw8ajAFSUJyMi9dPfTC3Wc7kSqZoNbqsPvEe8a5jXku-miS4NXgKbr__4GgocjI5cUb/exec'
    };

    var incoming = new URLSearchParams(window.location.search);
    var out = new URLSearchParams();

    // Forward ONLY what the app reads. Google also appends authuser, scope, iss and
    // prompt; authuser is part of what makes a direct redirect to script.google.com
    // fail (see the README), and none of the rest is the app's business.
    ['state', 'code', 'error'].forEach(function (k) {
      var v = incoming.get(k);
      if (v) out.set(k, v);
    });

    // state is "<random>.<appKey>". The random half is what the app verifies; the key
    // half is only routing, and is useless without the matching server-side entry.
    // An ALLOWLIST, not a URL from the query string - carrying the destination in the
    // URL would make this an open redirect, usable to lend our domain to a phishing
    // link.
    var key  = String(incoming.get('state') || '').split('.')[1] || 'portal';
    var dest = DESTINATIONS[key] || '';

    function stop(title, message) {
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('title').textContent = title;
      document.getElementById('msg').textContent = message;
      document.getElementById('go').href = DESTINATIONS.portal;
      document.getElementById('fallback').style.display = 'block';
    }

    if (!out.has('code') && !out.has('error')) {
      stop(T.idle_title, T.idle_msg);
      return;
    }
    if (!dest) {
      // Unrecognised key: refuse rather than guess. Guessing is how an open redirect
      // gets built by accident.
      stop(T.bad_title, T.bad_msg);
      return;
    }

    var target = dest + '?' + out.toString();
    document.getElementById('go').href = target;

    // Two frames guarantees the message above has actually been painted before the
    // browser starts tearing the page down. One frame is not enough on every engine,
    // and the cost is a few milliseconds against a hop that takes far longer.
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        // replace() rather than href= so this hop leaves no back-button trap.
        window.location.replace(target);
      });
    });

    // A last-resort link, not a progress report.
    //
    // At four seconds this fired during perfectly normal sign-ins: the navigation had
    // been issued and the browser was simply waiting for the destination, which is an
    // Apps Script cold start plus a token exchange. Announcing a problem that is not
    // happening - and offering a Continue that repeats what is already underway - is
    // worse than saying nothing.
    //
    // Twelve seconds is past the point where a working sign-in would still be
    // waiting, and the wording no longer claims to know anything.
    setTimeout(function () {
      document.getElementById('fallback').style.display = 'block';
      document.getElementById('msg').textContent = T.slow;
    }, 12000);
  })();
</script>
</body>
</html>
