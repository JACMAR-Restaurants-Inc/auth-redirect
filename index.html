<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signing you in…</title>
<style>
  body { font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
         margin: 0; display: grid; place-items: center; min-height: 100vh; color: #1f1f1f; }
  main { text-align: center; padding: 24px; max-width: 420px; }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 8px; }
  p { color: #5f6368; font-size: 14px; margin: 0 0 18px; }
  a { display: inline-block; font-weight: 600; background: #1a73e8; color: #fff;
      text-decoration: none; border-radius: 8px; padding: 11px 18px; }
</style>
</head>
<body>
<main>
  <h1>Signing you in…</h1>
  <p id="msg">One moment.</p>
  <p><a id="go" href="#">Continue</a></p>
</main>
<script>
  // Where each app lives. An ALLOWLIST, deliberately: the destination is chosen by
  // a key that arrives in `state`, and looking it up here means a crafted state can
  // only ever select one of these. Carrying the destination itself in the URL would
  // make this an open redirect, usable to lend our domain to a phishing link.
  //
  // Adding a gated app is one line here plus one line in the library. It needs no
  // new registration in the Cloud Console, because the redirect URI never changes.
  var DESTINATIONS = {
    'portal': 'https://script.google.com/macros/s/AKfycbw9ITLeoTRo1qI-MkmkAdPpId7GeqwT6LgL8V9igMxkPpQmVvK_WYqtwhkIcU4GuTDh/exec',
    // Safe Count, Phase 5 TEST deployment. Points at the test script and the test
    // spreadsheet - not the one Aylmer and Vanier use. Replace with the production
    // URL at cutover; do not add a second key, or a stale one will outlive its purpose.
    'safecount': 'https://script.google.com/macros/s/AKfycbw8ajAFSUJyMi9dPfTC3Wc7kSqZoNbqsPvEe8a5jXku-miS4NXgKbr__4GgocjI5cUb/exec'
  };

  // state is "<random>.<appKey>". The random half is what the app verifies; the
  // key half is only routing, and is useless without the matching cache entry.
  function destinationFor(state) {
    var key = String(state || '').split('.')[1] || 'portal';
    return DESTINATIONS[key] || '';
  }

  var incoming = new URLSearchParams(window.location.search);
  var out = new URLSearchParams();

  // Forward ONLY what the portal reads. Google also appends authuser, scope, iss
  // and prompt; authuser in particular is part of what makes a direct redirect to
  // script.google.com fail, and none of the rest is any of the portal's business.
  ['state', 'code', 'error'].forEach(function (k) {
    var v = incoming.get(k);
    if (v) out.set(k, v);
  });

  var dest = destinationFor(incoming.get('state'));

  if (!out.has('code') && !out.has('error')) {
    document.getElementById('msg').textContent =
      'This page is only used part-way through signing in. Open the portal instead.';
    document.getElementById('go').href = DESTINATIONS.portal;
  } else if (!dest) {
    // An unrecognised key. Refuse rather than guess - guessing is how an open
    // redirect gets built by accident.
    document.getElementById('msg').textContent =
      'This sign-in link is not one we recognise. Please start again from the portal.';
    document.getElementById('go').href = DESTINATIONS.portal;
  } else {
    var target = dest + '?' + out.toString();
    document.getElementById('go').href = target;
    // replace() rather than href= so this hop leaves no back-button trap.
    window.location.replace(target);
  }
</script>
</body>
</html>
