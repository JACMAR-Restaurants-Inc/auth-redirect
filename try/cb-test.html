<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Cash Balancing (test)</title>
<!--
  A TEST, 2026-09-11 - not linked from anywhere, not used by any manager.

  The question it answers: does showing an Apps Script app INSIDE a page on this
  (non-Google) site get past Google's account router? With several Google accounts
  signed in, opening script.google.com directly dies at /macros/u/1/s/... with
  "Sorry, unable to open the file at this time" before the app runs (RBAC CLAUDE.md
  §22). Incognito works, because no Google cookies are sent. Here the app is a
  cross-site frame, so the browser keeps Google's cookies out of it:
    - every iPhone browser (all WebKit) blocks cross-site cookies by default;
    - Chrome honours `credentialless`, which loads the frame with no cookies at all;
    - Firefox partitions them, so the frame gets an empty jar.
  Google then sees an anonymous visitor - the incognito case - and the app loads.

  It frames the Cash Balancing TEST deployment only.

  THE ROUND TRIP (step two, same day). The first load worked on the owner's iPhone
  with several accounts signed in. Signing in leaves this page for Google (the app's
  button uses target="_top"), and Google returns to the redirect page, which now
  sends the TEST app's sign-ins back HERE rather than to script.google.com - where
  the router would catch them again. This page hands the one-time code to the app
  inside the frame, which exchanges it server-side exactly as before.

  Only state, code and error are passed on, and only to the one address below - a
  URL taken from the query string would make this page an open redirect. The code is
  removed from this page's own address as soon as it is read, so a reload, a
  bookmark or the history never carries a spent one.
-->
<style>
  html, body { margin:0; height:100%; background:#1A1A1A; }
  body { display:flex; flex-direction:column; font:12px/1.4 -apple-system, 'Segoe UI', sans-serif; }
  .strip { flex:none; padding:4px 10px; padding-top:max(4px, env(safe-area-inset-top));
           background:#FFC72C; color:#1A1A1A; text-align:center; }
  iframe { flex:1; width:100%; border:0; display:block; }
</style>
</head>
<body>
  <div class="strip" id="strip">TEST · Cash Balancing (test) inside another page</div>
  <iframe credentialless id="app" title="Cash Balancing (test)"></iframe>
  <script>
    // The app, with the sign-in's one-time code if Google has just sent one back.
    var APP = 'https://script.google.com/macros/s/AKfycbw8ajAFSUJyMi9dPfTC3Wc7kSqZoNbqsPvEe8a5jXku-miS4NXgKbr__4GgocjI5cUb/exec';
    var incoming = new URLSearchParams(window.location.search);
    var out = new URLSearchParams();
    ['state', 'code', 'error'].forEach(function (k) {
      var v = incoming.get(k);
      if (v) out.set(k, v);
    });
    document.getElementById('app').src = out.toString() ? APP + '?' + out.toString() : APP;
    if (window.location.search) {
      try { history.replaceState(null, '', window.location.pathname); } catch (e) {}
    }

    // Which mechanism this browser is relying on, so a result can be read back.
    var s = document.getElementById('strip');
    var cl = 'credentialless' in HTMLIFrameElement.prototype;
    s.textContent += cl ? ' · cookie-free frame: yes' : ' · cookie-free frame: no (relies on blocked cross-site cookies)';
  </script>
</body>
</html>
